[project]
name = "policy-assistant"
version = "1.0.0"
description = "企业制度知识助手：RAG + LangGraph + 人工审批 + 可观测性的完整 Agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "langchain-core>=0.3,<2.0",
    "langchain-openai>=0.3,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "numpy>=2.0,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
